<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Судьба всё равно одна</title>
<style>
  body { background: #0d0d12; color: #ece6dc; font-family: Georgia, serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
  .container { padding: 20px; max-width: 400px; }
  h1 { font-size: 28px; letter-spacing: 2px; color: #c9a878; line-height: 1.4; }
  p { font-size: 16px; line-height: 1.6; margin-bottom: 20px; }
  button { background: transparent; border: 1px solid #c9a878; color: #c9a878; padding: 15px 30px; font-size: 16px; font-family: Georgia, serif; border-radius: 25px; cursor: pointer; margin-top: 20px; width: 100%; max-width: 300px; }
  button:active { background: rgba(201,168,120,0.2); }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="container" id="start-screen">
  <h1>СУДЬБА<br>ВСЁ РАВНО ОДНА</h1>
  <p style="font-style: italic; opacity: 0.7;">интерактивная новелла о терминизме<br>2016 → 2036</p>
  <button onclick="startGame()">НАЧАТЬ</button>
</div>

<div class="container hidden" id="game-screen">
  <h2 id="year" style="color:#c9a878; font-size: 18px; margin-bottom: 20px;"></h2>
  <p id="text" style="font-style: italic; min-height: 80px;"></p>
  <div id="choices"></div>
</div>

<script>
const scenes = {
  start: { year: "2016 год", text: "Песочница. Двое детей делят блестящий фантик.", choices: [
    { t: "Вера: «Отдай, это моё!»", next: "s2016a" },
    { t: "Марк: «Бери, у меня есть ещё»", next: "s2016b" }
  ]},
  s2016a: { year: "2016 год", text: "Фантик рвётся пополам. Оба плачут. Но фантик всё равно порван.", choices: [{ t: "Продолжить", next: "s2018" }]},
  s2016b: { year: "2016 год", text: "Фантик рвётся сам. Вера плачет. Марк молчит. Фантик всё равно порван.", choices: [{ t: "Продолжить", next: "s2018" }]},
  s2018: { year: "2018 год", text: "Первый полёт-оборот. Крылья ещё слабые.", choices: [
    { t: "Летим выше!", next: "s2018a" },
    { t: "Летим ниже!", next: "s2018b" }
  ]},
  s2018a: { year: "2018 год", text: "Высоко. Ветер. Оба падают в лужу. Мокрые, смеются.", choices: [{ t: "Продолжить", next: "s2026" }]},
  s2018b: { year: "2018 год", text: "Низко. Скучно. Вера дёргает за крыло. Оба падают в лужу.", choices: [{ t: "Продолжить", next: "s2026" }]},
  s2026: { year: "2026 год", text: "Главная ссора. Мост. Зеркальце между ними.", choices: [
    { t: "Мириться", next: "s2026a" },
    { t: "Уйти", next: "s2026b" }
  ]},
  s2026a: { year: "2026 год", text: "Протянула руку. Марк взял. Но зеркальце треснуло ещё раз.", choices: [{ t: "Продолжить", next: "s2036" }]},
  s2026b: { year: "2026 год", text: "Ушёл. Вера осталась. Через час он вернулся. Молча.", choices: [{ t: "Продолжить", next: "s2036" }]},
  s2036: { year: "2036 год. 26 лет.", text: "Тот же мост. Вера и Марк стоят рядом. Лица обоих — промежуточные, человек-птица.", choices: [{ t: "Завершить историю", next: "final" }]},
  final: { year: "ФИНАЛ", text: "Ты сделал несколько выборов. Но все они привели на этот мост. Судьба всё равно одна. Зеркальце падает. Трещина становится крылом.", choices: []}
};

function startGame() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');
  showScene('start');
}

function showScene(key) {
  const s = scenes[key];
  document.getElementById('year').textContent = s.year;
  document.getElementById('text').textContent = s.text;
  
  const choicesDiv = document.getElementById('choices');
  choicesDiv.innerHTML = '';
  
  if (s.choices && s.choices.length > 0) {
    s.choices.forEach(c => {
      const btn = document.createElement('button');
      btn.textContent = c.t;
      btn.onclick = function() { showScene(c.next); };
      choicesDiv.appendChild(btn);
    });
  } else {
    const btn = document.createElement('button');
    btn.textContent = "Начать заново";
    btn.onclick = function() {
      document.getElementById('start-screen').classList.remove('hidden');
      document.getElementById('game-screen').classList.add('hidden');
    };
    choicesDiv.appendChild(btn);
  }
}
</script>

</body>
                                       </html>
